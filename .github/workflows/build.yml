name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pygame ffpyplayer pillow pyinstaller
      - name: Convert PNG to ICO
        run: |
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32)])"
      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name GTA6 --icon=icon.ico --add-data "Pervoe.mp4;." --add-data "Loading.mp4;." --add-data "gta6_art.png;." gta6_landing.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Launcher-EXE
          path: dist/GTA6.exe
